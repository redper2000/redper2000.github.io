<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FFF3E0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="小头今天吃什么" />
<title>小头今天吃什么？</title>
<style>
  :root {
    --vd: #4A90D9;        /* 维D 蓝 */
    --vd-bg: #EAF3FD;
    --ad: #F0883E;        /* AD 橙 */
    --ad-bg: #FEF1E6;
    --done: #4CAF7D;
    --miss: #E57373;
    --ink: #3A3A3A;
    --muted: #9A9A9A;
    --card: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #FFF8EC 0%, #FFF0DD 55%, #FFE9D2 100%);
    color: var(--ink);
    min-height: 100vh;
    padding: env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 20px);
    max-width: 520px;
    margin: 0 auto;
  }

  /* ===== 顶部标题 ===== */
  header { text-align: center; padding: 34px 0 8px; }
  header h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: 2px; }

  /* ===== 视图切换 ===== */
  .tabs {
    display: flex; background: rgba(255,255,255,.75); border-radius: 999px;
    padding: 4px; margin: 20px 4px 14px; box-shadow: 0 2px 10px rgba(220,160,80,.12);
  }
  .tabs button {
    flex: 1; border: none; background: transparent; padding: 10px 0;
    border-radius: 999px; font-size: 0.95rem; color: var(--muted); cursor: pointer;
    transition: all .2s;
  }
  .tabs button.active { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

  /* ===== 今日卡片 ===== */
  .today-card {
    background: var(--card); border-radius: 26px; padding: 30px 22px 26px;
    text-align: center; box-shadow: 0 8px 28px rgba(220,160,80,.16);
    position: relative; overflow: hidden;
  }
  .today-card .date-line { color: var(--muted); font-size: 0.9rem; }
  .pill-wrap { margin: 20px 0 8px; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 2.8rem; font-weight: 800; padding: 18px 44px; border-radius: 24px;
    line-height: 1.15;
  }
  .pill.vd { background: var(--vd-bg); color: var(--vd); }
  .pill.ad { background: var(--ad-bg); color: var(--ad); }

  .done-btn {
    margin-top: 22px; width: 100%; border: none; cursor: pointer;
    padding: 16px 0; border-radius: 18px; font-size: 1.1rem; font-weight: 700;
    transition: all .2s; font-family: inherit;
  }
  .done-btn.todo { background: linear-gradient(135deg, #FFB15C, #F0883E); color: #fff; box-shadow: 0 6px 16px rgba(240,136,62,.35); }
  .done-btn.done { background: #E8F6EF; color: var(--done); box-shadow: none; }
  .done-btn:active { transform: scale(.97); }

  .streak { margin-top: 14px; font-size: 0.85rem; color: var(--muted); }
  .streak b { color: var(--done); }

  /* ===== 月历 ===== */
  .cal-card {
    background: var(--card); border-radius: 26px; padding: 18px 14px 14px;
    box-shadow: 0 8px 28px rgba(220,160,80,.16);
  }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 12px; }
  .cal-nav .ym { font-size: 1.1rem; font-weight: 800; }
  .cal-nav .nav-btns { display: flex; gap: 8px; }
  .cal-nav button {
    border: none; background: #FFF3E2; color: #C77B2A; width: 34px; height: 34px;
    border-radius: 12px; font-size: 1rem; cursor: pointer; font-family: inherit;
  }
  .cal-nav button.today-btn { width: auto; padding: 0 12px; font-size: 0.8rem; font-weight: 700; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-grid .wd { text-align: center; font-size: 0.72rem; color: var(--muted); padding: 6px 0; }
  .cell {
    aspect-ratio: 0.86; border-radius: 12px; background: #FAFAF7;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; cursor: pointer; user-select: none; position: relative;
    border: 1.5px solid transparent; transition: transform .1s;
  }
  .cell:active { transform: scale(.93); }
  .cell.empty { background: transparent; cursor: default; }
  .cell.empty:active { transform: none; }
  .cell .d { font-size: 0.82rem; font-weight: 600; }
  .cell .tag { font-size: 0.62rem; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
  .cell .tag.vd { color: var(--vd); background: var(--vd-bg); }
  .cell .tag.ad { color: var(--ad); background: var(--ad-bg); }
  .cell .mark { font-size: 0.75rem; line-height: 1; }
  .cell.done { background: #EDF8F2; }
  .cell.done .d { color: var(--done); }
  .cell.done .mark { color: var(--done); }
  .cell.missed { background: #FDF0F0; }
  .cell.missed .d { color: var(--miss); }
  .cell.future { opacity: .55; }
  .cell.is-today { border-color: #F0A35E; box-shadow: 0 0 0 3px rgba(240,163,94,.18); }

  .cal-stats { display: flex; gap: 10px; margin-top: 14px; }
  .stat {
    flex: 1; text-align: center; padding: 10px 4px; border-radius: 14px; font-size: 0.78rem;
  }
  .stat b { display: block; font-size: 1.15rem; margin-bottom: 2px; }
  .stat.s-done { background: #EDF8F2; color: var(--done); }
  .stat.s-miss { background: #FDF0F0; color: var(--miss); }
  .stat.s-rest { background: #F4F6FA; color: var(--muted); }

  .cal-tip { text-align: center; color: var(--muted); font-size: 0.72rem; margin-top: 12px; }

  footer { text-align: center; color: #C9BBA8; font-size: 0.7rem; margin-top: 26px; }

  .view { display: none; }
  .view.show { display: block; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<header>
  <h1>小头今天吃什么？</h1>
</header>

<div class="tabs">
  <button id="tab-today" class="active" onclick="switchView('today')">今天</button>
  <button id="tab-cal" onclick="switchView('cal')">月历</button>
</div>

<!-- ===== 今日视图 ===== -->
<div id="view-today" class="view show">
  <div class="today-card">
    <div class="date-line" id="today-date"></div>
    <div class="pill-wrap"><span class="pill" id="today-pill"></span></div>
    <button class="done-btn todo" id="done-btn" onclick="toggleToday()"></button>
    <div class="streak" id="streak"></div>
  </div>
</div>

<!-- ===== 月历视图 ===== -->
<div id="view-cal" class="view">
  <div class="cal-card">
    <div class="cal-nav">
      <div class="ym" id="cal-ym"></div>
      <div class="nav-btns">
        <button onclick="moveMonth(-1)">‹</button>
        <button class="today-btn" onclick="goToday()">今天</button>
        <button onclick="moveMonth(1)">›</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-stats">
      <div class="stat s-done"><b id="st-done">0</b>已吃</div>
      <div class="stat s-miss"><b id="st-miss">0</b>漏吃</div>
      <div class="stat s-rest"><b id="st-rest">0</b>剩余</div>
    </div>
    <div class="cal-tip">点击任意日期可以补记 / 取消记录</div>
  </div>
</div>

<footer>数据只保存在本设备</footer>

<script>
// ===== 核心规则：2026-07-30 吃维D，之后交替 =====
const ANCHOR = Date.UTC(2026, 6, 30); // 月份从 0 开始，6 = 7月
const DAY_MS = 86400000;
const LS_KEY = "xiaotou-advd-log";

function dayUTC(d) { return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); }
function dayOffset(d) { return Math.round((dayUTC(d) - ANCHOR) / DAY_MS); }
// 偶数偏移 = 维D，奇数偏移 = AD（对锚点之前的日期同样成立）
function medOf(d) { return ((dayOffset(d) % 2) + 2) % 2 === 0 ? "vd" : "ad"; }
function keyOf(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// ===== 记录存取 =====
function loadLog() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
}
function saveLog(log) { localStorage.setItem(LS_KEY, JSON.stringify(log)); }
function isDone(d) { return !!loadLog()[keyOf(d)]; }
function setDone(d, v) {
  const log = loadLog();
  if (v) log[keyOf(d)] = true; else delete log[keyOf(d)];
  saveLog(log);
}

const today = new Date();
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];

// ===== 今日视图 =====
function renderToday() {
  const med = medOf(today);
  const pill = document.getElementById("today-pill");
  pill.className = "pill " + med;
  pill.innerHTML = med === "vd" ? "<span>维&nbsp;D</span>" : "<span>AD</span>";

  document.getElementById("today-date").textContent =
    today.getFullYear() + "年" + (today.getMonth() + 1) + "月" + today.getDate() + "日 · 星期" + WEEK[today.getDay()];

  refreshDoneBtn();
  renderStreak();
}

function refreshDoneBtn() {
  const btn = document.getElementById("done-btn");
  const done = isDone(today);
  btn.className = "done-btn " + (done ? "done" : "todo");
  btn.textContent = done ? "✓ 今天已经吃过啦" : "吃完了，点我打卡";
}

function toggleToday() {
  setDone(today, !isDone(today));
  refreshDoneBtn();
  renderStreak();
}

// 连续打卡天数（从今天往前数）
function renderStreak() {
  let streak = 0;
  const d = new Date(today);
  while (isDone(d)) { streak++; d.setDate(d.getDate() - 1); }
  document.getElementById("streak").innerHTML =
    streak > 0 ? "已连续打卡 <b>" + streak + "</b> 天，继续保持！" : "吃完记得打卡，养成好习惯～";
}

// ===== 月历视图 =====
let viewY = today.getFullYear(), viewM = today.getMonth();

function renderCal() {
  document.getElementById("cal-ym").textContent = viewY + " 年 " + (viewM + 1) + " 月";
  const grid = document.getElementById("cal-grid");
  grid.innerHTML = "";

  ["日", "一", "二", "三", "四", "五", "六"].forEach(w => {
    const el = document.createElement("div");
    el.className = "wd"; el.textContent = w;
    grid.appendChild(el);
  });

  const first = new Date(viewY, viewM, 1);
  const daysInMonth = new Date(viewY, viewM + 1, 0).getDate();
  for (let i = 0; i < first.getDay(); i++) {
    const el = document.createElement("div");
    el.className = "cell empty";
    grid.appendChild(el);
  }

  const todayKey = keyOf(today);
  let nDone = 0, nMiss = 0, nRest = 0;

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(viewY, viewM, d);
    const med = medOf(date);
    const done = isDone(date);
    const isFuture = dayUTC(date) > dayUTC(today);
    const isToday = keyOf(date) === todayKey;

    const cell = document.createElement("div");
    cell.className = "cell";
    if (done) { cell.classList.add("done"); nDone++; }
    else if (isFuture) { cell.classList.add("future"); nRest++; }
    else { cell.classList.add("missed"); nMiss++; }
    if (isToday) cell.classList.add("is-today");

    cell.innerHTML =
      '<div class="d">' + d + '</div>' +
      '<div class="tag ' + med + '">' + (med === "vd" ? "维D" : "AD") + '</div>' +
      '<div class="mark">' + (done ? "✓" : (isFuture ? "" : "·")) + '</div>';

    cell.onclick = () => { setDone(date, !isDone(date)); renderCal(); };
    grid.appendChild(cell);
  }

  document.getElementById("st-done").textContent = nDone;
  document.getElementById("st-miss").textContent = nMiss;
  document.getElementById("st-rest").textContent = nRest;
}

function moveMonth(n) {
  viewM += n;
  if (viewM < 0) { viewM = 11; viewY--; }
  if (viewM > 11) { viewM = 0; viewY++; }
  renderCal();
}
function goToday() { viewY = today.getFullYear(); viewM = today.getMonth(); renderCal(); }

// ===== 视图切换 =====
function switchView(v) {
  document.getElementById("view-today").classList.toggle("show", v === "today");
  document.getElementById("view-cal").classList.toggle("show", v === "cal");
  document.getElementById("tab-today").classList.toggle("active", v === "today");
  document.getElementById("tab-cal").classList.toggle("active", v === "cal");
  if (v === "today") renderToday(); else renderCal();
}

renderToday();
renderCal();
</script>
</body>
</html>
